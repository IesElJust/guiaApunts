site_name: Material per a Mkdocs
#docs_dir: "md"
#site_dir: "docs"
nav:
  - 1. El tema Material: index.md
  - 2. Personalització: 2.personalitzacio.md
  - 3. Búsqueda i navegació: 3.busqueda_navegacio.md
  - 4. Admonitions-Alertes: 4.admonitions.md
  - 5. Formatació de codi: 5.formatacio.md
  - 6. Diagrames amb Mermaid: 6.mermaid.md
  - 7. Creació de PDF: 7.pdf.md


markdown_extensions:
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      # linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

theme:
  name: 'material'
  logo: 'img/logoMarkdown.png'
  favicon: 'img/logoMarkdown.png'
  icon:
    repo: 'fontawesome/brands/github'
  palette:
    # - primary: 'white'
    # Palette toggle for light mode
    - scheme: default
      primary: white
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    
  # features:
  #   - content.code.annotate

    # - navigation.sections
    # - navigation.top

